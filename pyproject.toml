[project]
name = "openthermcam"
version = "0.1.0"
description = "Open thermal camera viewer: live radiometric view, snapshots, measurement points, comparison and an MCP server for AI integration."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "websockets>=12.0",
    "httpx>=0.27",
    "mcp>=2.0",
]

[project.scripts]
openthermcam = "openthermcam.__main__:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openthermcam"]

[tool.pytest.ini_options]
testpaths = ["tests"]
